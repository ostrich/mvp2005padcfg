name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install --yes mingw-w64

      - name: Build
        run: make

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: release/mvp2005padcfg.exe
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: mvp2005padcfg.exe
          path: release

      - name: Name versioned executable
        run: mv release/mvp2005padcfg.exe "release/mvp2005padcfg-${GITHUB_REF_NAME}.exe"

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "mvp2005padcfg $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release/mvp2005padcfg-${GITHUB_REF_NAME}.exe" \
            --clobber

  publish-master:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: mvp2005padcfg.exe
          path: release

      - name: Name master executable
        run: mv release/mvp2005padcfg.exe release/mvp2005padcfg-master.exe

      - name: Publish latest master build
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view master-build; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/master-build" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          else
            gh release create master-build \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Latest master build" \
              --notes "Automated development build from the latest successful master commit. The executable is replaced after every successful master build."
          fi
          gh release upload master-build \
            release/mvp2005padcfg-master.exe \
            --clobber
